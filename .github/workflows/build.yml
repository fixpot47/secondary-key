name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle build --stacktrace

      - name: Prepare final jar
        run: |
          mkdir -p dist
          cp build/libs/secondary-key-1.0.0.jar dist/secondary-key.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: secondary-key-26.2
          path: dist/secondary-key.jar
